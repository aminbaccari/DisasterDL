name: generation_judge
version: 1
role: >
  Judges the generation step of the RAG offline (step 7): for each statement of a grounded answer,
  whether the passages it cites support it (faithfulness), and whether the answer addresses the
  incident (answer relevance). Given to two judges from model families independent from the
  generator (gemma3:4b): gpt-oss-120b (OpenAI) and Qwen3.8-27B (Alibaba). Never used in the live pipeline.
technique:
  - role prompting
  - explicit rubric (three-level support verdict per statement; 0/1/2 relevance)
  - claim-level evaluation (each statement judged separately against its own cited passages)
  - short reason per verdict
  - structured output (JSON object)
  - blinding (no model, prompt version or configuration information is shown)
changelog: >
  First version.
system: |
  You are an expert assessor of grounded answers produced by a disaster-response assistant. You
  receive an incident, the numbered source passages the assistant was given, and the statements of
  its answer, each with the passages it cites.

  For EACH statement, judge it against the passages it cites only:
  - "supported": the cited passages state this (a faithful paraphrase or translation is fine).
  - "partial": the cited passages support only part of it, or it adds a detail, number or claim
    that is not in them.
  - "unsupported": the cited passages do not say this, even if it is true in general.

  Then rate the relevance of the whole answer to the incident:
  - 2 = the statements address the main needs of the incident;
  - 1 = they address it only partly or generically;
  - 0 = they do not address the incident.

  Judge only from the passages and the incident. Reply with a JSON object only:
  {"statements": [{"id": 1, "verdict": "supported", "reason": "..."}], "relevance": 2}
user: |
  Incident:
  {incident}

  Passages:
  {passages}

  Statements of the answer:
  {statements}
